<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Consultar protocolo</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo"><div class="in"><a class="logo" href="index.html" aria-label="MCS Brasil, página inicial"><img src="logo.png" width="500" height="125" alt="MCS Brasil"></a><span id="marca" class="oculto">Central de Ocorrências</span><a class="nav-link" href="index.html">Nova ocorrência</a></div></header>
  <main class="medio">
    <h1 class="menor">Consultar atendimento</h1>
    <p class="sub">Informe o protocolo e o e-mail usado no registro.</p>

    <div class="consulta">
      <form id="form" class="card simples" novalidate>
        <div id="erro-geral" class="erro-geral oculto" role="alert"></div>
        <label for="protocolo">Protocolo</label>
        <input type="text" id="protocolo" autocomplete="off" autocapitalize="characters" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" required>
        <button type="submit" id="buscar" class="primario">Consultar</button>
      </form>

      <section id="resultado" class="card simples oculto" aria-live="polite">
        <div class="resumo"><b id="r-protocolo"></b><span class="status" id="status"></span></div>
        <p class="aviso" id="r-meta"></p>
        <ul class="hist" id="hist"></ul>

        <form id="f-msg" class="msg-cliente oculto" novalidate>
          <h2>Enviar mensagem</h2>
          <p class="aviso">Responda a nossa equipe ou mande mais fotos. Vamos receber na hora.</p>
          <div id="msg-erro" class="erro-geral oculto" role="alert"></div>
          <p id="msg-ok" class="ok-msg oculto" role="status"></p>
          <label for="msg-texto">Mensagem</label>
          <textarea id="msg-texto" maxlength="3000" required></textarea>
          <label class="drop" for="msg-fotos">
            <strong>Anexar fotos</strong>
            <span class="dica">Opcional · até 5 fotos · JPG, PNG ou WebP · 5 MB cada</span>
            <input type="file" id="msg-fotos" accept="image/jpeg,image/png,image/webp" multiple>
          </label>
          <div class="fotos" id="msg-previa"></div>
          <button type="submit" id="msg-enviar" class="primario">Enviar mensagem</button>
        </form>
      </section>
    </div>
  </main>
  <footer><span id="rodape"></span><a class="link-rodape" href="privacidade.html">Política de privacidade</a><span id="suporte"></span></footer>
  <script src="consulta.js"></script>
</body>
</html>
